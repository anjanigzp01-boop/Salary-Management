spring:
  application:
    name: salary-management-api
  datasource:
    # Kept beside the backend when running locally; ignored by Git.
    # This avoids requiring a pre-created runtime directory on a clean checkout.
    url: jdbc:sqlite:salary-management-v2.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true

app:
  seed:
    enabled: true
